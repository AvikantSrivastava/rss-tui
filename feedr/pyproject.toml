[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feedr"
version = "0.0.0"
description = "Terminal based RSS reader"
authors = [{name = "Avikant Srivastava", email = "contact@avikant.com"}]
requires-python = ">=3.11"
dependencies = [
    "textual>=6.11.0",
    "aiohttp>=3.13.3",
    "click>=8.3.1",
    "rich>=14.2.0",
    "lorem-text>=3.0",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.8.0",
    "textual-serve>=1.1.3",
]

[tool.setuptools.packages.find]
include = ["feedr*"]

[tool.setuptools.package-data]
feedr = ["*.tcss"]
